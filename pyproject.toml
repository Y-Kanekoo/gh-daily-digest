[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gh-daily-digest"
version = "0.1.0"
description = "GitHub の PR・HUMAN TODO・CI を集約する日次ダイジェスト"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
gh-daily-digest = "gh_daily_digest.cli:main"

[dependency-groups]
dev = ["ruff>=0.9", "mypy>=1.14", "pytest>=8", "pytest-cov>=6"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp --cov=gh_daily_digest --cov-report=term-missing --cov-fail-under=85"
